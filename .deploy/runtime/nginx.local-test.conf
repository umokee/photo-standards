pid /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx.pid;
error_log /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-access.log;
    client_body_temp_path /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-client-body;
    proxy_temp_path /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-proxy;
    fastcgi_temp_path /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-fastcgi;
    uwsgi_temp_path /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-uwsgi;
    scgi_temp_path /home/user/.jkljlk/photo-standards-db/.deploy/runtime/nginx-scgi;
    types_hash_max_size 4096;
    sendfile on;

    server {
        listen 127.0.0.1:8088;
        server_name localhost;

        root /home/user/.jkljlk/photo-standards-db/client/dist;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:3011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /storage/ {
            proxy_pass http://127.0.0.1:3011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:3011;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
