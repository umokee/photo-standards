[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",

  "sqlalchemy",
  "asyncpg",
  "psycopg[binary]",
  "pydantic-settings",
  "pydantic",
  "alembic",

  "bcrypt",
  "numpy",
  "pillow",
  "opencv-python",
  "requests",
  "psutil",

  "torch",
  "ultralytics",
  "shapely",
  "structlog",
  "rich",

  "aiortc",
  "av",

  "SAM-2 @ https://github.com/facebookresearch/sam2/archive/refs/heads/main.tar.gz",
  "lightglue @ https://github.com/cvg/LightGlue/archive/refs/heads/main.tar.gz",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
